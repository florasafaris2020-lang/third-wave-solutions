<!-- only the relevant form block changed -->
<form id="sellerForm" action="/api/business-submit" method="POST" enctype="multipart/form-data" style="margin-top:.9rem;">
  <input type="hidden" name="_subject" value="Seller submission — Third Wave Solutions website">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="_captcha" value="false">
  <div class="hp" aria-hidden="true"><label for="sehp">Leave empty</label><input id="sehp" type="text" name="_honey" tabindex="-1" autocomplete="off"></div>
  <div class="field-row">
    <div class="field">
      <label for="se-name">Your name <span class="req">*</span></label>
      <input id="se-name" name="Name" type="text" autocomplete="name" required>
    </div>
    <div class="field">
      <label for="se-phone">Phone / WhatsApp <span class="req">*</span></label>
      <input id="se-phone" name="Phone" type="tel" autocomplete="tel" required>
    </div>
  </div>
  <div class="field">
    <label for="se-email">Email address <span class="req">*</span></label>
    <input id="se-email" name="Email" type="email" autocomplete="email" required>
  </div>
  <div class="field-row">
    <div class="field">
      <label for="se-business">Business name &amp; type <span class="req">*</span></label>
      <input id="se-business" name="Business" type="text" placeholder="e.g. Rose Cafe — restaurant" required>
    </div>
    <div class="field">
      <label for="se-location">Location</label>
      <input id="se-location" name="Location" type="text" placeholder="e.g. Westlands, Nairobi">
    </div>
  </div>
  <div class="field">
    <label for="se-price">Asking price</label>
    <select id="se-price" name="Asking price">
      <option value="Not decided yet">Not decided yet</option>
      <option>Under KES 2M</option>
      <option>KES 2M – 5M</option>
      <option>KES 5M – 10M</option>
      <option>Over KES 10M</option>
    </select>
  </div>
  <div class="field">
    <label for="se-notes">About the business</label>
    <textarea id="se-notes" name="Notes" placeholder="What the business does, monthly sales, staff, licence status and why you are selling."></textarea>
  </div>
  <div class="field">
    <label for="se-docs">Business documents (optional)</label>
    <input id="se-docs" name="Documents" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" multiple>
  </div>
  <div class="field">
    <label class="checkline" for="se-consent" style="font-weight:400;">
      <input id="se-consent" name="Consent" type="checkbox" value="Agreed to be contacted" required>
      <span>I agree to be contacted about selling this business. <span class="req">*</span></span>
    </label>
  </div>
  <button class="btn btn--primary" type="submit">Send business details</button>
  <div id="formStatus" class="form-note" role="status" aria-live="polite"></div>
  <div id="formSuccess" class="form-note" style="display:none; margin-top:1rem; padding:1rem; background:#e8f6f2; border-radius:var(--radius-md);">
    <p class="success-text" style="margin:0; font-size:0.95rem;">Thank you! Your business proposal is pending approval.</p>
    <p class="small" style="margin:0.5rem 0 0 0; color:#0c5e5b;">We'll review your submission and email you at <a href="mailto:s.lakhani1@aim.com" style="color:#0a5f59;">s.lakhani1@aim.com</a>.</p>
  </div>
</form>
