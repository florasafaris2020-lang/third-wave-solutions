<script>
(() => {
  const grid = document.querySelector('.grid.grid--3');
  if (!grid) return;

  fetch('data/businesses.json', { cache: 'no-store' })
    .then((response) => response.ok ? response.json() : [])
    .then((items) => {
      const approved = Array.isArray(items) ? items.filter((item) => item && item.status === 'approved') : [];
      if (!approved.length) return;

      approved.forEach((item) => {
        const article = document.createElement('article');
        article.className = 'card listing';
        article.innerHTML = `
          <div class="listing-media">
            <img src="${item.image || 'assets/img/retail.jpg'}" alt="${escapeHtml(item.businessName || 'Approved business listing')}" loading="lazy">
            <span class="badge">Approved listing</span>
          </div>
          <div class="listing-body">
            <div class="listing-top">
              <h3>${escapeHtml(item.businessName || 'Approved listing')}</h3>
              <span class="ask">${escapeHtml(item.askingPrice || 'Discussed')}</span>
            </div>
            <span class="loc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11Z"/><circle cx="12" cy="10" r="2.3"/></svg>${escapeHtml(item.location || 'Kenya')}</span>
            <p class="desc">${escapeHtml(item.description || 'Approved business listing.')}</p>
            <div class="listing-meta">
              <span>Contact <b>${escapeHtml(item.contactName || 'Seller')}</b></span>
              <span>Phone <b>${escapeHtml(item.phone || 'Available on request')}</b></span>
            </div>
          </div>
        `;
        grid.appendChild(article);
      });
    })
    .catch((error) => {
      console.warn('Approved listings could not be loaded:', error);
    });

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, (char) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;',
    }[char]));
  }
})();
</script>
