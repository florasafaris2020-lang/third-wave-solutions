<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Third Wave Solutions</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
          <rect width="48" height="48" rx="12" fill="#0a2230" />
          <path d="M8 30c3.4 0 3.4-5 6.8-5s3.4 5 6.8 5 3.4-5 6.8-5 3.4 5 6.8 5 3.4-5 6.8-5" fill="none" stroke="#7fd4c9" stroke-width="2.6" stroke-linecap="round" />
          <path d="M8 22.5c3.4 0 3.4-5 6.8-5s3.4 5 6.8 5 3.4-5 6.8-5 3.4 5 6.8 5 3.4-5 6.8-5" fill="none" stroke="#0e7c74" stroke-width="2.2" stroke-linecap="round" opacity=".55" />
          <path d="M8 37.5c3.4 0 3.4-5 6.8-5s3.4 5 6.8 5 3.4-5 6.8-5 3.4 5 6.8 5 3.4-5 6.8-5" fill="none" stroke="#c48a2c" stroke-width="2.2" stroke-linecap="round" opacity=".8" />
        </svg>
        <span class="brand-text"><span class="brand-name">Third Wave Solutions</span><span class="brand-sub">Business Sales &amp; Vetting</span></span>
      </a>
      <a class="btn btn--ghost btn--sm" href="index.html">Back to home</a>
    </div>
  </header>

  <main id="main">
    <section class="page-head">
      <div class="wrap">
        <p class="breadcrumb"><a href="index.html">Home</a> &nbsp;/&nbsp; Contact</p>
        <span class="eyebrow">Get in touch</span>
        <h1>Send Third Wave a message</h1>
        <p>Tell us how we can help. We’ll get back to you as soon as we can.</p>
      </div>
    </section>

    <section class="section section--sand">
      <div class="wrap narrow">
        <div class="form-card">
          <form id="thirdwaveForm" action="https://formsubmit.app/f/m876hpuch8" method="POST">
            <input type="hidden" name="_subject" value="New message — Third Wave Solutions">
            <input type="hidden" name="_ts" id="thirdwaveTimestamp" value="">
            <input type="text" name="_gotcha" value="" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">

            <div class="field">
              <label for="thirdwaveName">Name <span class="req" aria-hidden="true">*</span></label>
              <input id="thirdwaveName" name="name" type="text" autocomplete="name" required>
            </div>
            <div class="field">
              <label for="thirdwaveEmail">Email <span class="req" aria-hidden="true">*</span></label>
              <input id="thirdwaveEmail" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="thirdwaveMessage">Message <span class="req" aria-hidden="true">*</span></label>
              <textarea id="thirdwaveMessage" name="message" required></textarea>
            </div>
            <button class="btn btn--primary btn--block" type="submit">Send message</button>
            <p id="thirdwaveStatus" class="form-note" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";
      var form = document.getElementById("thirdwaveForm");
      var status = document.getElementById("thirdwaveStatus");
      var button = form.querySelector('button[type="submit"]');
      var timestamp = document.getElementById("thirdwaveTimestamp");
      var initialTimestamp = String(Date.now());
      timestamp.value = initialTimestamp;

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (!form.reportValidity()) return;

        var honeypot = form.elements.namedItem("_gotcha");
        if (honeypot.value) return;

        button.disabled = true;
        status.textContent = "";
        status.removeAttribute("style");

        try {
          var response = await fetch(form.action, {
            method: "POST",
            body: new FormData(form),
            headers: { Accept: "application/json" }
          });
          var result = await response.json();

          if (response.ok && result && result.ok === true) {
            form.reset();
            timestamp.value = initialTimestamp;
            status.textContent = "Thanks for your message. We’ll be in touch soon.";
            status.style.color = "#0a5f59";
          } else {
            status.textContent = result && result.error && result.error.message
              ? result.error.message
              : "We couldn’t send your message. Please try again.";
            status.style.color = "#b4423a";
          }
        } catch (error) {
          status.textContent = error && error.message
            ? error.message
            : "Unable to send your message. Please try again.";
          status.style.color = "#b4423a";
        } finally {
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
