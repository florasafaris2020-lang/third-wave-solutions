name: One-shot form endpoint fix

on:
  push:
    paths:
      - .github/workflows/one-shot-form-endpoint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace placeholder FormSubmit endpoint
        run: |
          set -euo pipefail
          sed -i 's|https://formsubmit.app/f/abc123|https://formsubmit.app/f/xvfwex8rvq|g' public/*.html
          if grep -rn 'formsubmit.app/f/abc123' public; then
            echo "::error::placeholder endpoint still present"
            exit 1
          fi
          grep -rc 'formsubmit.app/f/xvfwex8rvq' public/*.html
          git diff --stat

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/one-shot-form-endpoint.yml
          git add public
          git commit -m "Point static form actions at the live FormSubmit form xvfwex8rvq"
          git push origin HEAD:main
